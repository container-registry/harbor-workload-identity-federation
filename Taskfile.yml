version: '3'

vars:
  APP: credential-provider-harbor
  INSTALLER: credential-provider-harbor-installer
  MODULE: github.com/container-registry/harbor-workload-identity-federation
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  CHART_VERSION:
    sh: |
      tag=$(git describe --tags --exact-match 2>/dev/null || true)
      if [ -n "$tag" ]; then
        printf '%s' "${tag#v}"
      else
        awk '/^version:/ {print $2}' deploy/helm/credential-provider-harbor/Chart.yaml
      fi
  REGISTRY_ADDRESS: '{{default "8gears.container-registry.com" .REGISTRY_ADDRESS}}'
  PROJECT_NAME: '{{default "8gcr" .PROJECT_NAME}}'
  REGISTRY: '{{.REGISTRY_ADDRESS}}/{{.PROJECT_NAME}}'
  IMAGE_NAME: credential-provider-harbor-deployer
  CHART: credential-provider-harbor

tasks:
  default:
    desc: Build the credential-provider-harbor binaries
    cmds:
      - task: build

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run tests
    cmds:
      - go test -race -v ./...

  build:
    desc: Build binaries for current platform
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - './bin/{{.APP}}'
      - './bin/{{.INSTALLER}}'
    cmds:
      - go build -ldflags="-s -w -X main.version={{.VERSION}}"
          -o bin/{{.APP}} ./cmd/{{.APP}}/
      - go build -ldflags="-s -w"
          -o bin/{{.INSTALLER}} ./cmd/{{.INSTALLER}}/

  build-all:
    desc: Cross-compile for linux/amd64 and linux/arm64
    cmds:
      - for:
          matrix:
            GOOS: [linux]
            GOARCH: [amd64, arm64]
        cmd: >-
          CGO_ENABLED=0 GOOS={{.ITEM.GOOS}} GOARCH={{.ITEM.GOARCH}}
          go build -ldflags="-s -w -X main.version={{.VERSION}}"
          -o bin/{{.APP}}-{{.ITEM.GOOS}}-{{.ITEM.GOARCH}}
          ./cmd/{{.APP}}/
      - for:
          matrix:
            GOOS: [linux]
            GOARCH: [amd64, arm64]
        cmd: >-
          CGO_ENABLED=0 GOOS={{.ITEM.GOOS}} GOARCH={{.ITEM.GOARCH}}
          go build -ldflags="-s -w"
          -o bin/{{.INSTALLER}}-{{.ITEM.GOOS}}-{{.ITEM.GOARCH}}
          ./cmd/{{.INSTALLER}}/

  docker-build:
    desc: Build Docker image for the local platform
    cmds:
      - docker build --build-arg VERSION={{.VERSION}}
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.VERSION}}
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:latest .

  docker-push-version:
    desc: Build and push multi-arch Docker image without latest tag
    cmds:
      - docker buildx build --platform linux/amd64,linux/arm64
          --build-arg VERSION={{.VERSION}}
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.VERSION}}
          --push .

  docker-push:
    desc: Build and push multi-arch Docker image
    cmds:
      - docker buildx build --platform linux/amd64,linux/arm64
          --build-arg VERSION={{.VERSION}}
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.VERSION}}
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:latest
          --push .

  helm-package:
    desc: Package the Helm chart
    cmds:
      - mkdir -p dist
      - helm package deploy/helm/{{.CHART}}/
          --destination dist
          --version {{.CHART_VERSION}}
          --app-version {{.VERSION}}

  helm-push:
    desc: Package and push the Helm chart as OCI
    deps: [helm-package]
    cmds:
      - helm push dist/{{.CHART}}-{{.CHART_VERSION}}.tgz oci://{{.REGISTRY}}

  helm-lint:
    desc: Lint the Helm chart
    cmds:
      - helm lint deploy/helm/credential-provider-harbor/ --set registry.host=harbor.example.com

  helm-template:
    desc: Render the Helm chart for supported profiles
    cmds:
      - helm template credential-provider-harbor deploy/helm/credential-provider-harbor/ --set registry.host=harbor.example.com --set profile=generic >/dev/null
      - helm template credential-provider-harbor deploy/helm/credential-provider-harbor/ --set registry.host=harbor.example.com --set profile=eks >/dev/null
      - helm template credential-provider-harbor deploy/helm/credential-provider-harbor/ --set registry.host=harbor.example.com --set profile=k3s >/dev/null
      - helm template credential-provider-harbor deploy/helm/credential-provider-harbor/ --set registry.host=harbor.example.com --set profile=kind >/dev/null
      - helm template credential-provider-harbor deploy/helm/credential-provider-harbor/ --set registry.host=harbor.example.com --set profile=gke >/dev/null

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/ dist/

  check:
    desc: Run every CI check that does not need a cluster
    cmds:
      - task: spellcheck
      - task: commit-lint
      - task: dco-check
      - task: license-check
      - task: lint
      - task: test
      - task: build-all
      - task: helm-lint
      - task: helm-template

  spellcheck:
    desc: Run spell checker (mirrors CI)
    cmds:
      - typos --config .typos.toml

  commit-lint:
    desc: Check commits follow Conventional Commits format
    cmds:
      - |
        pattern="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?(!)?: .+"
        for commit in $(git log --format=%H origin/main..HEAD 2>/dev/null || git log --format=%H -5); do
          msg=$(git log -1 --format=%s $commit)
          if ! echo "$msg" | grep -Eq "$pattern"; then
            echo "ERROR: Commit $commit does not follow Conventional Commits"
            echo "  Message: $msg"
            echo "  Format: <type>[scope]: <description>"
            exit 1
          fi
        done
        echo "All commits follow Conventional Commits format"

  dco-check:
    desc: Check commits have DCO sign-off
    cmds:
      - |
        for commit in $(git log --format=%H origin/main..HEAD 2>/dev/null || git log --format=%H -5); do
          if ! git log -1 --format=%B $commit | grep -q "^Signed-off-by:"; then
            echo "ERROR: Commit $commit missing DCO sign-off"
            echo "Fix with: git commit --amend -s"
            exit 1
          fi
        done
        echo "All commits have DCO sign-off"

  license-check:
    desc: Check Go dependency licenses (mirrors CI)
    cmds:
      - go-licenses check ./... --disallowed_types=forbidden,restricted,reciprocal,unknown --ignore=$(go list -m)
    status:
      - '! test -f go.mod'

  setup:
    desc: Install tools and git hooks
    deps: [install-tools]
    cmds:
      - lefthook install

  install-tools:
    desc: Install the CLI tools the checks need
    cmds:
      - command -v typos || brew install typos-cli || cargo install typos-cli
      - command -v lefthook || brew install lefthook || go install github.com/evilmartians/lefthook@latest
      - command -v golangci-lint || brew install golangci-lint || go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - command -v go-licenses || go install github.com/google/go-licenses@v1.6.0
      - |
        # go install puts binaries in GOBIN, which is not always on PATH.
        gobin=$(go env GOBIN); [ -n "$gobin" ] || gobin="$(go env GOPATH)/bin"
        case ":$PATH:" in
          *":$gobin:"*) ;;
          *) echo "NOTE: add $gobin to PATH so the Go-installed tools are found" ;;
        esac
