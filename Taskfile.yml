version: '3'

vars:
  APP: credential-provider-harbor
  INSTALLER: credential-provider-harbor-installer
  MODULE: github.com/container-registry/harbor-workload-identity-federation
  CHART_DIR: deploy/helm/credential-provider-harbor
  DIST: '{{default "dist" .DIST}}'
  # Version of the binaries and the image. Overridable: task docker-push VERSION=v1.2.3
  GIT_VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  VERSION: '{{default .GIT_VERSION .VERSION}}'
  # Chart version and appVersion come from Chart.yaml, which release-please maintains.
  CHART_VERSION_FILE:
    sh: awk '/^version:/ {print $2; exit}' deploy/helm/credential-provider-harbor/Chart.yaml
  CHART_APP_VERSION_FILE:
    sh: awk '/^appVersion:/ {gsub(/"/, "", $2); print $2; exit}' deploy/helm/credential-provider-harbor/Chart.yaml
  CHART_VERSION: '{{default .CHART_VERSION_FILE .CHART_VERSION}}'
  CHART_APP_VERSION: '{{default .CHART_APP_VERSION_FILE .CHART_APP_VERSION}}'
  REGISTRY_ADDRESS: '{{default "8gears.container-registry.com" .REGISTRY_ADDRESS}}'
  PROJECT_NAME: '{{default "8gcr" .PROJECT_NAME}}'
  REGISTRY: '{{.REGISTRY_ADDRESS}}/{{.PROJECT_NAME}}'
  IMAGE_NAME: credential-provider-harbor-deployer
  CHART: credential-provider-harbor

  # Tool versions, pinned so a local run behaves the way CI does.
  TYPOS_VERSION: 1.50.2
  GOLANGCI_LINT_VERSION: v2.13.2

tasks:
  default:
    desc: Build the credential-provider-harbor binaries
    cmds:
      - task: build

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run tests
    cmds:
      - go test -race -v ./...

  build:
    desc: Build binaries for current platform
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - './bin/{{.APP}}'
      - './bin/{{.INSTALLER}}'
    cmds:
      - go build -ldflags="-s -w -X main.version={{.VERSION}}"
          -o bin/{{.APP}} ./cmd/{{.APP}}/
      - go build -ldflags="-s -w -X main.version={{.VERSION}}"
          -o bin/{{.INSTALLER}} ./cmd/{{.INSTALLER}}/

  build-all:
    desc: Cross-compile for linux/amd64 and linux/arm64
    cmds:
      - task: _cross-build
        vars: {BINARY: '{{.APP}}', PACKAGE: './cmd/{{.APP}}/', OUT_DIR: bin}
      - task: _cross-build
        vars: {BINARY: '{{.INSTALLER}}', PACKAGE: './cmd/{{.INSTALLER}}/', OUT_DIR: bin}

  # The one place that decides which platforms are supported and which build
  # flags they get. build-all and release-assets both go through it, so a
  # local cross-compile cannot drift from the released binaries.
  _cross-build:
    internal: true
    requires:
      vars: [BINARY, PACKAGE, OUT_DIR]
    cmds:
      - mkdir -p {{.OUT_DIR}}
      - for: [amd64, arm64]
        cmd: >-
          CGO_ENABLED=0 GOOS=linux GOARCH={{.ITEM}}
          go build -trimpath -ldflags="-s -w -X main.version={{.VERSION}}"
          -o {{.OUT_DIR}}/{{.BINARY}}-linux-{{.ITEM}}
          {{.PACKAGE}}

  docker-build:
    desc: Build Docker image for the local platform
    cmds:
      - docker build --build-arg VERSION={{.VERSION}}
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.VERSION}}
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:latest .

  docker-push-version:
    desc: Build and push multi-arch Docker image without latest tag
    cmds:
      - docker buildx build --platform linux/amd64,linux/arm64
          --build-arg VERSION={{.VERSION}}
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.VERSION}}
          --push .

  docker-push:
    desc: Build and push multi-arch Docker image
    cmds:
      - docker buildx build --platform linux/amd64,linux/arm64
          --build-arg VERSION={{.VERSION}}
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.VERSION}}
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:latest
          --push .

  helm-package:
    desc: Package the Helm chart into dist/
    cmds:
      - mkdir -p {{.DIST}}
      - helm package {{.CHART_DIR}}/
          --destination {{.DIST}}
          --version {{.CHART_VERSION}}
          --app-version {{.CHART_APP_VERSION}}

  helm-push:
    desc: Package and push the Helm chart as an OCI artifact
    deps: [helm-package]
    cmds:
      - helm push {{.DIST}}/{{.CHART}}-{{.CHART_VERSION}}.tgz oci://{{.REGISTRY}}

  version-check:
    desc: Check the chart's appVersion still tracks the released binary version
    cmds:
      - |
        set -eu
        # The chart's default image tag is "v" plus appVersion, and only the
        # binary train publishes that image. appVersion therefore has to equal
        # the binary version release-please records in the manifest.
        #
        # Nothing in release-please's helm strategy writes appVersion today:
        # it updates Chart.yaml through the ChartYaml updater, which sets
        # `version` only. This check is what makes that an enforced invariant
        # rather than an assumption about release-please internals. It runs on
        # release pull requests too, so a chart release that moved appVersion
        # fails here instead of 404ing on an image pull.
        app_version='{{.CHART_APP_VERSION_FILE}}'
        binary_version=$(awk -F'"' '/"\.":/ {print $4; exit}' .release-please-manifest.json)
        if [ -z "$binary_version" ]; then
          echo "ERROR: cannot read the \".\" version from .release-please-manifest.json" >&2
          exit 1
        fi
        if [ "$app_version" != "$binary_version" ]; then
          echo "ERROR: chart appVersion and the released binary version disagree." >&2
          echo "  Chart.yaml appVersion:              $app_version" >&2
          echo "  .release-please-manifest.json \".\": $binary_version" >&2
          echo "  The chart defaults its image tag to v$app_version, which the binary train never published." >&2
          exit 1
        fi
        echo "chart appVersion $app_version matches the released binary version"

  helm-lint:
    desc: Lint the Helm chart
    cmds:
      - helm lint {{.CHART_DIR}}/ --strict --set registry.host=harbor.example.com

  helm-template:
    desc: Render every profile, every branch a value switches on, and the install notes
    cmds:
      - |
        # One entry point for every render: the chart path and the one required
        # value live here, each case below adds only what makes it that case.
        # The manifest is captured rather than piped, because a pipeline runs
        # helm in a subshell where a failed render cannot stop the task.
        render() {
          desc=$1; shift
          manifest=$(helm template {{.CHART}} {{.CHART_DIR}}/ \
            --set registry.host=harbor.example.com "$@" 2>&1) || {
            echo "ERROR: rendering $desc failed:"; echo "$manifest"; exit 1
          }
          echo "rendered: $desc"
        }
        renders_kind() {
          desc=$1; kind=$2; shift 2
          render "$desc" "$@"
          printf '%s\n' "$manifest" | grep -q "^kind: $kind$" || {
            echo "ERROR: $desc renders no $kind"; exit 1
          }
          echo "render ok: $desc renders a $kind"
        }
        omits_kind() {
          desc=$1; kind=$2; shift 2
          render "$desc" "$@"
          if printf '%s\n' "$manifest" | grep -q "^kind: $kind$"; then
            echo "ERROR: $desc still renders a $kind"; exit 1
          fi
          echo "render ok: $desc renders no $kind"
        }
        renders_line() {
          desc=$1; line=$2; shift 2
          render "$desc" "$@"
          printf '%s\n' "$manifest" | grep -qF "$line" || {
            echo "ERROR: $desc never renders: $line"; exit 1
          }
          echo "render ok: $desc renders \"$line\""
        }
        for profile in generic eks aws k3s k3d rke2 kind gke aks microk8s; do
          render "profile $profile" --set profile="$profile"
        done
        render "profile custom with host paths" \
          --set profile=custom \
          --set credentialProvider.binDir=/opt/credential-providers \
          --set credentialProvider.configPath=/etc/credential-providers/config.yaml
        # The profile loop runs every template on the defaults, which leaves the
        # branches a value switches on unrendered. Each of these picks one.
        render "kubelet.configure=false on eks" --set profile=eks --set kubelet.configure=false
        render "kubelet.configure=false" --set kubelet.configure=false
        render "kubelet.restart=false" --set kubelet.restart=false
        render "readinessProbe.enabled=false" --set readinessProbe.enabled=false
        render "a relocated installedMarker" --set installer.installedMarker=/var/opt/cph/marker
        renders_line "podLabels" "team: platform" --set podLabels.team=platform
        renders_line "podLabels" "app.kubernetes.io/name: credential-provider-harbor" \
          --set podLabels.team=platform
        renders_line "a podLabel that tries to displace a selector label" \
          "app.kubernetes.io/name: credential-provider-harbor" \
          --set podLabels."app\.kubernetes\.io/name"=hijacked
        render "podAnnotations" --set podAnnotations.owner=platform
        # podLabels and podAnnotations emptied the way a values file empties
        # them: the key is present with no value, so the template sees nil.
        render "podLabels emptied out" --set podLabels=null
        render "podAnnotations emptied out" --set podAnnotations=null
        # The opt-outs, which render fewer manifests rather than different ones:
        # a broken one shows up as a missing or a leftover object, not as a
        # render error, so each is checked by kind.
        renders_kind "the defaults" ClusterRole
        renders_kind "the defaults" ServiceAccount
        omits_kind "nodeAudienceRbac.create=false" ClusterRole --set nodeAudienceRbac.create=false
        omits_kind "nodeAudienceRbac.create=false" ClusterRoleBinding --set nodeAudienceRbac.create=false
        omits_kind "serviceAccount.create=false" ServiceAccount --set serviceAccount.create=false
        renders_line "serviceAccount.create=false" "serviceAccountName: default" \
          --set serviceAccount.create=false
        renders_line "serviceAccount.create=false with a name" "serviceAccountName: preexisting" \
          --set serviceAccount.create=false --set serviceAccount.name=preexisting
      - |
        # helm template executes NOTES.txt but throws the output away, so a
        # branch that renders and still says the wrong thing ships silently.
        # --dry-run=client prints it, and needs no cluster. The install is
        # captured before the NOTES are filtered out of it: through a pipe, a
        # failed install leaves sed succeeding on nothing and every assertion
        # below reading an empty string as agreement.
        notes() {
          desc=$1; shift
          out=$(helm install {{.CHART}} {{.CHART_DIR}}/ --dry-run=client \
            --set registry.host=harbor.example.com "$@" 2>&1) || {
            echo "ERROR: the install notes for $desc failed to render:"; echo "$out"; exit 1
          }
          notes_text=$(printf '%s\n' "$out" | sed -n '/^NOTES:/,$p')
          if [ -z "$notes_text" ]; then
            echo "ERROR: the install for $desc printed no NOTES section"; exit 1
          fi
        }
        says() {
          desc=$1; text=$2; shift 2
          notes "$desc" "$@"
          printf '%s\n' "$notes_text" | grep -qF "$text" || {
            echo "ERROR: the install notes for $desc never say: $text"; exit 1
          }
          echo "notes ok: $desc says \"$text\""
        }
        silent_on() {
          desc=$1; text=$2; shift 2
          notes "$desc" "$@"
          if printf '%s\n' "$notes_text" | grep -qF "$text"; then
            echo "ERROR: the install notes for $desc still claim: $text"; exit 1
          fi
          echo "notes ok: $desc drops \"$text\""
        }
        says "the defaults" "kubelet restart included"
        says "the defaults" "this is a first install"
        silent_on "kubelet.restart=false" "kubelet restart included" --set kubelet.restart=false
        says "kubelet.restart=false" "Kubelet restart is off" --set kubelet.restart=false
        says "kubelet.restart=false" "IMPORTANT: Kubelet restart is disabled" --set kubelet.restart=false
        silent_on "kubelet.restart=false" "this is a first install" --set kubelet.restart=false
        says "kubelet.configure=false on eks" "Kubelet configuration is off" \
          --set profile=eks --set kubelet.configure=false
        says "kubelet.configure=false on eks" "EKS-optimized AL2023 AMI" \
          --set profile=eks --set kubelet.configure=false
        says "kubelet.configure=false on eks" "Bottlerocket" \
          --set profile=eks --set kubelet.configure=false
        says "kubelet.configure=false on generic" "IMPORTANT: Kubelet configuration is disabled" \
          --set kubelet.configure=false
        says "readinessProbe.enabled=false" "The readiness probe is disabled" \
          --set readinessProbe.enabled=false
        says "the defaults" "The chart created"
        says "nodeAudienceRbac.create=false" "Create equivalent RBAC" \
          --set nodeAudienceRbac.create=false
        echo "the install notes match every configuration above"

  examples-check:
    desc: Render every example values file against the chart
    cmds:
      - |
        set -u
        # go-task runs this through its own shell interpreter, not bash, so
        # this stays POSIX: the file list lives in the positional parameters
        # rather than an array, and nothing depends on nullglob. An unmatched
        # glob stays literal, which is what the -f test catches.
        set -- examples/kubernetes/*/*values.yaml
        if [ ! -f "$1" ]; then
          echo "ERROR: no example values files found under examples/kubernetes/"
          exit 1
        fi
        status=0
        for f in "$@"; do
          if helm template {{.CHART}} {{.CHART_DIR}}/ -f "$f" >/dev/null; then
            echo "ok: $f"
          else
            echo "ERROR: $f does not render against the chart"
            status=1
          fi
        done
        exit $status

  helm-schema-check:
    desc: Check that values.schema.json rejects the misconfigurations it is meant to catch
    cmds:
      - |
        # A render can fail for reasons that have nothing to do with the
        # schema, which would make every case below look like a pass.
        reject() {
          desc=$1; shift
          out=$(helm template {{.CHART}} {{.CHART_DIR}}/ "$@" 2>&1) && {
            echo "ERROR: schema accepted $desc"; exit 1
          }
          case "$out" in
            *"don't meet the specifications of the schema"*) ;;
            *) echo "ERROR: $desc failed for another reason, not the schema:"; echo "$out"; exit 1 ;;
          esac
          echo "rejected: $desc"
        }
        reject "an empty registry.host"
        reject "an unknown profile" --set registry.host=harbor.example.com --set profile=openshift
        reject "profile=custom without host paths" --set registry.host=harbor.example.com --set profile=custom
        reject "a bad cacheDuration" --set registry.host=harbor.example.com --set registry.cacheDuration=1hour
        reject "a relative hostRoot" --set registry.host=harbor.example.com --set installer.hostRoot=host
        reject "a hostRoot of /" --set registry.host=harbor.example.com --set installer.hostRoot=/
        reject "a hostRoot with a trailing slash" --set registry.host=harbor.example.com --set installer.hostRoot=/host/
        reject "a relative installedMarker" --set registry.host=harbor.example.com --set installer.installedMarker=run/marker
        reject "an installedMarker on /run" --set registry.host=harbor.example.com --set installer.installedMarker=/run/credential-provider-harbor-installed
        reject "an installedMarker on /var/run" --set registry.host=harbor.example.com --set installer.installedMarker=/var/run/credential-provider-harbor-installed
        reject "an installedMarker of /run itself" --set registry.host=harbor.example.com --set installer.installedMarker=/run
        reject "an installedMarker of /" --set registry.host=harbor.example.com --set installer.installedMarker=/
        reject "an installedMarker with a trailing slash" --set registry.host=harbor.example.com --set installer.installedMarker=/var/lib/credential-provider-harbor/
        reject "a binDir of /" --set registry.host=harbor.example.com --set credentialProvider.binDir=/
        reject "a configPath of /" --set registry.host=harbor.example.com --set credentialProvider.configPath=/
        reject "a configPath with a trailing slash" --set registry.host=harbor.example.com --set credentialProvider.configPath=/etc/credential-providers/
        reject "a systemdDropInPath of /" --set registry.host=harbor.example.com --set kubelet.systemdDropInPath=/
        reject "a k3sConfigDropInPath with a trailing slash" --set registry.host=harbor.example.com --set kubelet.k3sConfigDropInPath=/etc/rancher/k3s/config.yaml.d/
        reject "a relative binDir" --set registry.host=harbor.example.com --set credentialProvider.binDir=opt/providers
        reject "a relative configPath" --set registry.host=harbor.example.com --set credentialProvider.configPath=etc/config.yaml
        reject "a binaryName with a path in it" --set registry.host=harbor.example.com --set credentialProvider.binaryName=../credential-provider-harbor
        reject "a binaryName of ." --set registry.host=harbor.example.com --set credentialProvider.binaryName=.
        reject "a binaryName of .." --set registry.host=harbor.example.com --set credentialProvider.binaryName=..
        reject "a relative kubeletDefaultsPath" --set registry.host=harbor.example.com --set kubelet.kubeletDefaultsPath=etc/default/kubelet
        reject "a relative rke2ConfigDropInPath" --set registry.host=harbor.example.com --set kubelet.rke2ConfigDropInPath=etc/rancher/rke2/config.yaml.d/99.yaml
        reject "a relative microk8sArgsPath" --set registry.host=harbor.example.com --set kubelet.microk8sArgsPath=var/snap/microk8s/current/args/kubelet
        reject "updateStrategy.type=Recreate" --set registry.host=harbor.example.com --set updateStrategy.type=Recreate
        reject "a maxUnavailable above one" --set registry.host=harbor.example.com --set updateStrategy.rollingUpdate.maxUnavailable=5
        reject "a maxSurge that adds a second installer per node" --set registry.host=harbor.example.com --set updateStrategy.rollingUpdate.maxSurge=1
        reject "an unprivileged securityContext" --set registry.host=harbor.example.com --set securityContext.privileged=false
        reject "a securityContext with privileged dropped" --set registry.host=harbor.example.com --set securityContext.privileged=null
        reject "a securityContext removed wholesale" --set registry.host=harbor.example.com --set securityContext=null
        reject "runAsNonRoot alongside privileged" --set registry.host=harbor.example.com --set securityContext.runAsNonRoot=true
        reject "a non-root runAsUser" --set registry.host=harbor.example.com --set securityContext.runAsUser=1000
        reject "privilege escalation turned off under privileged" --set registry.host=harbor.example.com --set securityContext.allowPrivilegeEscalation=false
        reject "a boolean podLabel value" --set registry.host=harbor.example.com --set podLabels.debug=true
        reject "a numeric podLabel value" --set registry.host=harbor.example.com --set podLabels.rev=3
        reject "a boolean podAnnotation value" --set registry.host=harbor.example.com --set podAnnotations.debug=true
        reject "a boolean serviceAccount annotation value" --set registry.host=harbor.example.com --set serviceAccount.annotations.debug=true
        reject "a boolean nodeSelector value" --set registry.host=harbor.example.com --set nodeSelector.spot=true
        reject "a boolean extraEnv value" --set registry.host=harbor.example.com --set extraEnv[0].name=PRESERVE_ECR_PROVIDER --set extraEnv[0].value=false
        echo "values.schema.json rejects every case above"

        # The constraints above must not have moved the supported values out of
        # range, so re-check the ones a reject case brushes against.
        accept() {
          desc=$1; shift
          helm template {{.CHART}} {{.CHART_DIR}}/ "$@" >/dev/null || {
            echo "ERROR: schema rejected $desc"; exit 1
          }
          echo "accepted: $desc"
        }
        accept "the default values" --set registry.host=harbor.example.com
        accept "a dotfile binaryName" --set registry.host=harbor.example.com --set credentialProvider.binaryName=.harbor-provider
        accept "an installedMarker somewhere else on persistent storage" --set registry.host=harbor.example.com --set installer.installedMarker=/var/opt/cph/marker
        accept "the documented one-node-at-a-time update strategy" --set registry.host=harbor.example.com --set updateStrategy.type=RollingUpdate --set updateStrategy.rollingUpdate.maxUnavailable=1
        accept "string podLabels, podAnnotations and nodeSelector" --set registry.host=harbor.example.com --set podLabels.team=platform --set podAnnotations.owner=platform --set nodeSelector.spot=true --set-string nodeSelector.spot=true
        accept "a quoted extraEnv value" --set registry.host=harbor.example.com --set extraEnv[0].name=PRESERVE_ECR_PROVIDER --set-string extraEnv[0].value=false
        accept "a marker directly under a top-level directory" --set registry.host=harbor.example.com --set installer.installedMarker=/cph-marker
        accept "an explicit systemd drop-in path" --set registry.host=harbor.example.com --set kubelet.systemdDropInPath=/etc/systemd/system/kubelet.service.d/50-cph.conf
        accept "a securityContext field the installer does not care about" --set registry.host=harbor.example.com --set securityContext.seccompProfile.type=RuntimeDefault
        echo "values.schema.json accepts every case above"

  release-assets:
    desc: Build the release binaries and checksums into dist/
    cmds:
      - rm -rf {{.DIST}} && mkdir -p {{.DIST}}
      - task: _cross-build
        vars: {BINARY: '{{.APP}}', PACKAGE: './cmd/{{.APP}}/', OUT_DIR: '{{.DIST}}'}
      - task: _cross-build
        vars: {BINARY: '{{.INSTALLER}}', PACKAGE: './cmd/{{.INSTALLER}}/', OUT_DIR: '{{.DIST}}'}
      # macOS ships shasum, not sha256sum. Both write the same
      # "<hash>  <file>" lines, so SHA256SUMS is identical either way.
      - |
        cd {{.DIST}}
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum credential-provider-* > SHA256SUMS
        elif command -v shasum >/dev/null 2>&1; then
          shasum -a 256 credential-provider-* > SHA256SUMS
        else
          echo "ERROR: neither sha256sum nor shasum is available, so the checksums cannot be written." >&2
          exit 1
        fi

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/ {{.DIST}}

  check:
    desc: Run every CI check that does not need a cluster
    cmds:
      - task: spellcheck
      - task: lint
      - task: test
      - task: build-all
      - task: version-check
      - task: helm-lint
      - task: helm-template
      - task: helm-schema-check
      - task: examples-check

  spellcheck:
    desc: Run spell checker (mirrors CI)
    cmds:
      - typos --config .typos.toml

  setup:
    desc: Install the developer tools
    deps: [install-tools]

  install-tools:
    desc: Install the pinned CLI tools the checks need
    cmds:
      - |
        set -eu

        if ! command -v go >/dev/null 2>&1; then
          echo "ERROR: Go is required to install the developer tools. See CONTRIBUTING.md." >&2
          exit 1
        fi
        bin_dir=$(go env GOBIN)
        if [ -z "$bin_dir" ]; then
          # GOPATH can hold several entries; go install writes into the bin
          # directory of the first one, so "$GOPATH/bin" is wrong for a list.
          gopath=$(go env GOPATH)
          bin_dir="${gopath%%:*}/bin"
        fi
        mkdir -p "$bin_dir"
        # go install writes into $bin_dir; the check at the end reports
        # whether the calling shell can actually see that directory.
        original_path="$PATH"
        PATH="$bin_dir:$PATH"
        export PATH

        # Module version recorded in a Go-built binary; empty when unknown.
        go_tool_version() {
          bin=$(command -v "$1" 2>/dev/null) || return 0
          go version -m "$bin" 2>/dev/null | awk '$1 == "mod" { print $3; exit }'
        }

        # Presence is not enough: an older binary drifts from what CI runs.
        ensure_go_tool() { # <binary> <module> <pinned version>
          have=$(go_tool_version "$1")
          if [ "$have" = "$3" ]; then
            echo "$1 $3 already installed"
            return 0
          fi
          if [ -n "$have" ]; then
            echo "$1 $have does not match the pinned $3, reinstalling"
          fi
          GOBIN="$bin_dir" go install "$2@$3"
        }

        # sha256 of each release archive for the pinned TYPOS_VERSION. A GitHub
        # release asset can be replaced after the fact, so the download is
        # checked against these before it runs as a developer tool. Regenerate
        # when the pin moves:
        #   curl -fsSL <asset-url> | sha256sum
        typos_sha256() { # <arch>-<os>
          case "$1" in
            x86_64-unknown-linux-musl)  echo abcb3e257c7c2abeff4d903f7fe68071357637605bdb283ce2251f44bc70dc09 ;;
            aarch64-unknown-linux-musl) echo 27c4b6d0ba6f37d120ce32117777d703fc9d57ba71f16e8bcde5b35c987cf9b8 ;;
            x86_64-apple-darwin)        echo 7480a081e51d428d94f560ef8b855ae0decb7c35cc686925ed887c5f51b1ecf1 ;;
            aarch64-apple-darwin)       echo 70d61e9d682034133f0aa56f5a02bae0de168495f3cce62a87054aa7186c1901 ;;
            *) return 1 ;;
          esac
        }

        sha256_of() { # <file>
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$1" | awk '{print $1}'
          else
            return 1
          fi
        }

        install_typos() { # <pinned version>
          case "$(uname -s)" in
            Linux) target_os=unknown-linux-musl ;;
            Darwin) target_os=apple-darwin ;;
            *) target_os= ;;
          esac
          case "$(uname -m)" in
            x86_64 | amd64) target_arch=x86_64 ;;
            arm64 | aarch64) target_arch=aarch64 ;;
            *) target_arch= ;;
          esac
          target="$target_arch-$target_os"
          if [ -n "$target_os" ] && [ -n "$target_arch" ] && command -v curl >/dev/null 2>&1 && want_sha=$(typos_sha256 "$target"); then
            url="https://github.com/crate-ci/typos/releases/download/v$1/typos-v$1-$target.tar.gz"
            tmp=$(mktemp -d)
            echo "Downloading $url"
            # Saved to disk rather than piped into tar: a stream tar has already
            # unpacked cannot be checked against a digest.
            if curl -fsSL -o "$tmp/typos.tar.gz" "$url"; then
              got_sha=$(sha256_of "$tmp/typos.tar.gz") || got_sha=""
              if [ -z "$got_sha" ]; then
                rm -rf "$tmp"
                echo "ERROR: neither sha256sum nor shasum is available, so the typos download cannot be verified." >&2
                echo "  Install one of them, or install typos yourself and rerun 'task setup'." >&2
                return 1
              fi
              if [ "$got_sha" != "$want_sha" ]; then
                rm -rf "$tmp"
                echo "ERROR: checksum mismatch for $url" >&2
                echo "  expected $want_sha" >&2
                echo "  got      $got_sha" >&2
                echo "  Nothing was installed. Update the digest in Taskfile.yml if the pin moved;" >&2
                echo "  otherwise the release asset was replaced and should not be trusted." >&2
                return 1
              fi
              if tar -xzf "$tmp/typos.tar.gz" -C "$tmp"; then
                install -m 0755 "$tmp/typos" "$bin_dir/typos"
                rm -rf "$tmp"
                return 0
              fi
            fi
            rm -rf "$tmp"
          fi
          if command -v cargo >/dev/null 2>&1; then
            # --root keeps the build out of ~/.cargo/bin so every tool this
            # task installs ends up in the one directory reported below.
            tmp=$(mktemp -d)
            if cargo install typos-cli --version "$1" --locked --root "$tmp"; then
              install -m 0755 "$tmp/bin/typos" "$bin_dir/typos"
              rm -rf "$tmp"
              return 0
            fi
            rm -rf "$tmp"
          fi
          echo "ERROR: cannot install typos $1 on this machine." >&2
          echo "  Install it from https://github.com/crate-ci/typos/releases or with cargo," >&2
          echo "  then rerun 'task setup'." >&2
          return 1
        }

        typos_want="{{.TYPOS_VERSION}}"
        typos_have=$(typos --version 2>/dev/null | awk '{print $NF}') || typos_have=""
        if [ "$typos_have" = "$typos_want" ]; then
          echo "typos $typos_want already installed"
        else
          if [ -n "$typos_have" ]; then
            echo "typos $typos_have does not match the pinned $typos_want, reinstalling"
          fi
          install_typos "$typos_want"
        fi

        ensure_go_tool golangci-lint github.com/golangci/golangci-lint/v2/cmd/golangci-lint {{.GOLANGCI_LINT_VERSION}}

        # The tools just landed in $bin_dir. If the shell running task cannot
        # see that directory, stop here rather than let 'task check' fail later
        # with command-not-found.
        missing=""
        for tool in typos golangci-lint; do
          (PATH="$original_path"; command -v "$tool" >/dev/null 2>&1) || missing="$missing $tool"
        done
        if [ -n "$missing" ]; then
          echo "ERROR: installed into $bin_dir, but your PATH does not reach:$missing" >&2
          echo "  Add the Go bin directory to PATH, then rerun 'task setup':" >&2
          echo "    export PATH=\"$bin_dir:\$PATH\"" >&2
          exit 1
        fi
