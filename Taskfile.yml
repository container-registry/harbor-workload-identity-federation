version: '3'

vars:
  APP: credential-provider-harbor
  INSTALLER: credential-provider-harbor-installer
  MODULE: github.com/container-registry/harbor-workload-identity-federation
  CHART_DIR: deploy/helm/credential-provider-harbor
  DIST: '{{default "dist" .DIST}}'
  # Version of the binaries and the image. Overridable: task docker-push VERSION=v1.2.3
  GIT_VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  VERSION: '{{default .GIT_VERSION .VERSION}}'
  # Chart version and appVersion come from Chart.yaml, which release-please maintains.
  CHART_VERSION_FILE:
    sh: awk '/^version:/ {print $2; exit}' deploy/helm/credential-provider-harbor/Chart.yaml
  CHART_APP_VERSION_FILE:
    sh: awk '/^appVersion:/ {gsub(/"/, "", $2); print $2; exit}' deploy/helm/credential-provider-harbor/Chart.yaml
  CHART_VERSION: '{{default .CHART_VERSION_FILE .CHART_VERSION}}'
  CHART_APP_VERSION: '{{default .CHART_APP_VERSION_FILE .CHART_APP_VERSION}}'
  REGISTRY_ADDRESS: '{{default "8gears.container-registry.com" .REGISTRY_ADDRESS}}'
  PROJECT_NAME: '{{default "8gcr" .PROJECT_NAME}}'
  REGISTRY: '{{.REGISTRY_ADDRESS}}/{{.PROJECT_NAME}}'
  IMAGE_NAME: credential-provider-harbor-deployer
  CHART: credential-provider-harbor

tasks:
  default:
    desc: Build the credential-provider-harbor binaries
    cmds:
      - task: build

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run tests
    cmds:
      - go test -race -v ./...

  build:
    desc: Build binaries for current platform
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - './bin/{{.APP}}'
      - './bin/{{.INSTALLER}}'
    cmds:
      - go build -ldflags="-s -w -X main.version={{.VERSION}}"
          -o bin/{{.APP}} ./cmd/{{.APP}}/
      - go build -ldflags="-s -w"
          -o bin/{{.INSTALLER}} ./cmd/{{.INSTALLER}}/

  build-all:
    desc: Cross-compile for linux/amd64 and linux/arm64
    cmds:
      - for:
          matrix:
            GOOS: [linux]
            GOARCH: [amd64, arm64]
        cmd: >-
          CGO_ENABLED=0 GOOS={{.ITEM.GOOS}} GOARCH={{.ITEM.GOARCH}}
          go build -ldflags="-s -w -X main.version={{.VERSION}}"
          -o bin/{{.APP}}-{{.ITEM.GOOS}}-{{.ITEM.GOARCH}}
          ./cmd/{{.APP}}/
      - for:
          matrix:
            GOOS: [linux]
            GOARCH: [amd64, arm64]
        cmd: >-
          CGO_ENABLED=0 GOOS={{.ITEM.GOOS}} GOARCH={{.ITEM.GOARCH}}
          go build -ldflags="-s -w"
          -o bin/{{.INSTALLER}}-{{.ITEM.GOOS}}-{{.ITEM.GOARCH}}
          ./cmd/{{.INSTALLER}}/

  docker-build:
    desc: Build Docker image for the local platform
    cmds:
      - docker build --build-arg VERSION={{.VERSION}}
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.VERSION}}
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:latest .

  docker-push-version:
    desc: Build and push multi-arch Docker image without latest tag
    cmds:
      - docker buildx build --platform linux/amd64,linux/arm64
          --build-arg VERSION={{.VERSION}}
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.VERSION}}
          --push .

  docker-push:
    desc: Build and push multi-arch Docker image
    cmds:
      - docker buildx build --platform linux/amd64,linux/arm64
          --build-arg VERSION={{.VERSION}}
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.VERSION}}
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:latest
          --push .

  helm-package:
    desc: Package the Helm chart into dist/
    cmds:
      - mkdir -p {{.DIST}}
      - helm package {{.CHART_DIR}}/
          --destination {{.DIST}}
          --version {{.CHART_VERSION}}
          --app-version {{.CHART_APP_VERSION}}

  helm-push:
    desc: Package and push the Helm chart as an OCI artifact
    deps: [helm-package]
    cmds:
      - helm push {{.DIST}}/{{.CHART}}-{{.CHART_VERSION}}.tgz oci://{{.REGISTRY}}

  helm-lint:
    desc: Lint the Helm chart
    cmds:
      - helm lint {{.CHART_DIR}}/ --strict --set registry.host=harbor.example.com

  helm-template:
    desc: Render the chart for every supported profile
    cmds:
      - for: [generic, eks, aws, k3s, k3d, kind, gke]
        cmd: >-
          helm template {{.CHART}} {{.CHART_DIR}}/
          --set registry.host=harbor.example.com
          --set profile={{.ITEM}} >/dev/null
      - >-
        helm template {{.CHART}} {{.CHART_DIR}}/
        --set registry.host=harbor.example.com
        --set profile=custom
        --set credentialProvider.binDir=/opt/credential-providers
        --set credentialProvider.configPath=/etc/credential-providers/config.yaml >/dev/null

  helm-schema-check:
    desc: Check that values.schema.json rejects the mistakes it is meant to
    cmds:
      - |
        # A render can fail for reasons that have nothing to do with the
        # schema, which would make every case below look like a pass.
        reject() {
          desc=$1; shift
          out=$(helm template {{.CHART}} {{.CHART_DIR}}/ "$@" 2>&1) && {
            echo "ERROR: schema accepted $desc"; exit 1
          }
          case "$out" in
            *"don't meet the specifications of the schema"*) ;;
            *) echo "ERROR: $desc failed for another reason, not the schema:"; echo "$out"; exit 1 ;;
          esac
          echo "rejected: $desc"
        }
        reject "an empty registry.host"
        reject "an unknown profile" --set registry.host=harbor.example.com --set profile=openshift
        reject "profile=custom without host paths" --set registry.host=harbor.example.com --set profile=custom
        reject "a bad cacheDuration" --set registry.host=harbor.example.com --set registry.cacheDuration=1hour
        reject "a relative hostRoot" --set registry.host=harbor.example.com --set installer.hostRoot=host
        reject "a relative binDir" --set registry.host=harbor.example.com --set credentialProvider.binDir=opt/providers
        reject "a relative configPath" --set registry.host=harbor.example.com --set credentialProvider.configPath=etc/config.yaml
        reject "a binaryName with a path in it" --set registry.host=harbor.example.com --set credentialProvider.binaryName=../credential-provider-harbor
        echo "values.schema.json rejects every case above"

  release-assets:
    desc: Build the release binaries and checksums into dist/
    cmds:
      - rm -rf {{.DIST}} && mkdir -p {{.DIST}}
      - task: _release-binary
        vars: {BINARY: '{{.APP}}', PACKAGE: './cmd/{{.APP}}/'}
      - task: _release-binary
        vars: {BINARY: '{{.INSTALLER}}', PACKAGE: './cmd/{{.INSTALLER}}/'}
      - cd {{.DIST}} && sha256sum credential-provider-* > SHA256SUMS

  _release-binary:
    internal: true
    requires:
      vars: [BINARY, PACKAGE]
    cmds:
      - for: [amd64, arm64]
        cmd: >-
          CGO_ENABLED=0 GOOS=linux GOARCH={{.ITEM}}
          go build -trimpath -ldflags="-s -w -X main.version={{.VERSION}}"
          -o {{.DIST}}/{{.BINARY}}-linux-{{.ITEM}}
          {{.PACKAGE}}

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/ {{.DIST}}

  check:
    desc: Run every CI check that does not need a cluster
    cmds:
      - task: spellcheck
      - task: commit-lint
      - task: dco-check
      - task: license-check
      - task: lint
      - task: test
      - task: build-all
      - task: helm-lint
      - task: helm-template
      - task: helm-schema-check

  spellcheck:
    desc: Run spell checker (mirrors CI)
    cmds:
      - typos --config .typos.toml

  commit-lint:
    desc: Check commits follow Conventional Commits format
    cmds:
      - |
        pattern="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?(!)?: .+"
        for commit in $(git log --format=%H origin/main..HEAD 2>/dev/null || git log --format=%H -5); do
          msg=$(git log -1 --format=%s $commit)
          if ! echo "$msg" | grep -Eq "$pattern"; then
            echo "ERROR: Commit $commit does not follow Conventional Commits"
            echo "  Message: $msg"
            echo "  Format: <type>[scope]: <description>"
            exit 1
          fi
        done
        echo "All commits follow Conventional Commits format"

  dco-check:
    desc: Check commits have DCO sign-off
    cmds:
      - |
        for commit in $(git log --format=%H origin/main..HEAD 2>/dev/null || git log --format=%H -5); do
          if ! git log -1 --format=%B $commit | grep -q "^Signed-off-by:"; then
            echo "ERROR: Commit $commit missing DCO sign-off"
            echo "Fix with: git commit --amend -s"
            exit 1
          fi
        done
        echo "All commits have DCO sign-off"

  license-check:
    desc: Check Go dependency licenses (mirrors CI)
    cmds:
      - go-licenses check ./... --disallowed_types=forbidden,restricted,reciprocal,unknown --ignore=$(go list -m)
    status:
      - '! test -f go.mod'

  setup:
    desc: Install tools and git hooks
    deps: [install-tools]
    cmds:
      - lefthook install

  install-tools:
    desc: Install the CLI tools the checks need
    cmds:
      - command -v typos || brew install typos-cli || cargo install typos-cli
      - command -v lefthook || brew install lefthook || go install github.com/evilmartians/lefthook@latest
      - command -v golangci-lint || brew install golangci-lint || go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - command -v go-licenses || go install github.com/google/go-licenses@v1.6.0
      - |
        # go install puts binaries in GOBIN, which is not always on PATH.
        gobin=$(go env GOBIN); [ -n "$gobin" ] || gobin="$(go env GOPATH)/bin"
        case ":$PATH:" in
          *":$gobin:"*) ;;
          *) echo "NOTE: add $gobin to PATH so the Go-installed tools are found" ;;
        esac
