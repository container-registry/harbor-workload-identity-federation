apiVersion: v2
name: credential-provider-harbor
description: >-
  Installs the credential-provider-harbor kubelet plugin on every node so pods
  pull Harbor images with service account tokens instead of pull secrets
type: application
kubeVersion: '>=1.34.0-0'
version: 0.1.0
appVersion: 0.0.1
keywords:
  - harbor
  - credential-provider
  - federated-robot-accounts
  - fedidp
  - kubernetes
  - kubelet
