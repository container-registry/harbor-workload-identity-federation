apiVersion: v2
name: credential-provider-harbor
description: Installs the credential-provider-harbor kubelet plugin on every
  node so pods pull Harbor images with service account tokens instead of pull
  secrets
type: application
kubeVersion: ">=1.34.0-0"
version: 0.2.1
appVersion: "0.1.3" # x-release-please-version
keywords:
  - harbor
  - credential-provider
  - federated-robot-accounts
  - fedidp
  - kubernetes
  - kubelet
maintainers:
  - name: container-registry
    url: https://github.com/container-registry
icon: https://container-registry.com/img/logo.svg
annotations:
  artifacthub.io/license: Apache-2.0
  # Kept in step with appVersion by scripts/sync-chart-images.sh, which the
  # release workflow runs after an app release. That sync is what gives the
  # chart a commit of its own to be released for.
  artifacthub.io/images: |
    - name: credential-provider-harbor-deployer
      image: 8gears.container-registry.com/8gcr/credential-provider-harbor-deployer:v0.1.3
  artifacthub.io/operator: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/container-registry/harbor-workload-identity-federation
    - name: documentation
      url: https://container-registry.com/docs/
  artifacthub.io/maintainers: |
    - name: container-registry
      email: support@8gears.com
home: https://github.com/container-registry/harbor-workload-identity-federation
sources:
  - https://github.com/container-registry/harbor-workload-identity-federation
