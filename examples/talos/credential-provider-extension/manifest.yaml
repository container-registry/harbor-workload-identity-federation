version: v1alpha1
metadata:
  name: credential-provider-harbor
  # Bump on every rebuild so `talosctl get extensions` reflects the change.
  version: v0.1.0
  author: your-org
  description: |
    Harbor Workload Identity Federation kubelet image credential provider
    (KEP-4412). Installs the credential-provider-harbor binary to
    /usr/local/lib/kubelet/credentialproviders so the kubelet can authenticate
    to a Harbor registry using a pod ServiceAccount token.
  compatibility:
    talos:
      # Match the Talos release running on your nodes.
      version: ">= v1.12.0"
