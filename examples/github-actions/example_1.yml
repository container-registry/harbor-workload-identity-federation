name: Create Image and Push Using Federated Robot Account

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # 👈 required for OIDC JWT
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get OIDC token
        id: oidc
        run: |
          echo "Requesting OIDC token"
          RESPONSE=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=silly-snyder.container-registry.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV

          # JWT segments are unpadded base64url; base64 -d wants padded standard base64.
          jwt_part() {
            p=$(echo "$TOKEN" | cut -d'.' -f"$1" | tr '_-' '/+')
            case $(( ${#p} % 4 )) in 2) p="$p==" ;; 3) p="$p=" ;; esac
            echo "$p" | base64 -d | jq .
          }
          echo "=== JWT Header ==="
          jwt_part 1
          echo ""
          echo "=== JWT Payload ==="
          jwt_part 2

      - name: Build and Push Image
        run: |
          echo $TOKEN | docker login -u not-relevant --password-stdin silly-snyder.container-registry.com
          docker build -t silly-snyder.container-registry.com/library/image:${{ github.sha }} .
          docker push silly-snyder.container-registry.com/library/image:${{ github.sha }}

      - name: Pull Image from Registry
        run: |
          echo $TOKEN | docker login -u not-relevant --password-stdin silly-snyder.container-registry.com
          docker pull silly-snyder.container-registry.com/library/image:${{ github.sha }}
