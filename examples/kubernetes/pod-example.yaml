apiVersion: v1
kind: Pod
metadata:
  name: httpd
  namespace: default
spec:
  serviceAccountName: default
  containers:
  - name: httpd
    # Replace with an image that exists in YOUR Harbor. harbor.example.com is a
    # placeholder; applied as-is this pod sits in ImagePullBackOff, which looks
    # exactly like a broken credential provider.
    image: harbor.example.com/library/httpd
    imagePullPolicy: Always
