# Azure Kubernetes Service.
#
# The aks profile exists because the AKS kubelet unit builds its command line
# from $KUBELET_FLAGS in /etc/default/kubelet and never expands
# $KUBELET_EXTRA_ARGS, so the systemd drop-in the generic profile writes is
# read and does nothing. The installer patches KUBELET_FLAGS instead.

profile: aks

registry:
  host: harbor.example.com
  audience: harbor.example.com
