# kubeadm and other systemd nodes whose kubelet unit reads KUBELET_EXTRA_ARGS.
#
#   helm upgrade --install credential-provider-harbor \
#     oci://8gears.container-registry.com/8gcr/credential-provider-harbor \
#     --namespace kube-system -f examples/kubernetes/kubeadm/values.yaml

profile: generic

registry:
  host: harbor.example.com
  # Must match the audience configured in the Harbor Federated IDP, exactly.
  audience: harbor.example.com

kubelet:
  configure: true
  restart: true
