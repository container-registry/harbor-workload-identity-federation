# /etc/rancher/rke2/config.yaml.d/99-credential-provider-harbor.yaml
#
# This is what the rke2 profile writes. It is here for reference, and for
# clusters whose node configuration is provisioned declaratively rather than by
# the DaemonSet. RKE2 has no flags of its own for these, unlike k3s: they reach
# the embedded kubelet through kubelet-arg, without the leading dashes.

kubelet-arg:
  - "image-credential-provider-bin-dir=/var/lib/rancher/credentialprovider/bin"
  - "image-credential-provider-config=/var/lib/rancher/credentialprovider/config.yaml"
