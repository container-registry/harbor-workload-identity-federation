# MicroK8s.
#
# kubelet runs from the snap inside kubelite, and its arguments come from
# /var/snap/microk8s/current/args/kubelet rather than from a command line or a
# systemd drop-in. The microk8s profile edits that file and restarts
# snap.microk8s.daemon-kubelite. The binary and the config go under
# /var/snap/microk8s/common, which survives a snap refresh.

profile: microk8s

registry:
  host: harbor.example.com
  audience: harbor.example.com
