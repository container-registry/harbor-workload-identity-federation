[Service]
# Optional kind fallback, for a node image whose kubelet unit does not expand
# $KUBELET_EXTRA_ARGS at all. The variable is still expanded here, so whatever
# the node image put in it survives: kind sets --runtime-cgroups there, and
# dropping that moves the kubelet cgroup and breaks the node.
ExecStart=
ExecStart=/usr/bin/kubelet $KUBELET_KUBECONFIG_ARGS $KUBELET_CONFIG_ARGS $KUBELET_KUBEADM_ARGS $KUBELET_EXTRA_ARGS --image-credential-provider-bin-dir=/var/lib/kubelet/credential-provider --image-credential-provider-config=/var/lib/kubelet/credential-provider-config.yaml
