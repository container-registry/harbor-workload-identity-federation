# Flux 2.10 removed `create` on serviceaccounts/token from the default
# controller RBAC (fluxcd/flux2#6139). source-controller and
# image-reflector-controller need it back to mint a token for the
# ServiceAccount named in spec.serviceAccountName. kustomize-controller and
# helm-controller are bound to cluster-admin and need nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-object-identity
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-object-identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-object-identity
subjects:
  - kind: ServiceAccount
    name: source-controller
    namespace: flux-system
  - kind: ServiceAccount
    name: image-reflector-controller
    namespace: flux-system
