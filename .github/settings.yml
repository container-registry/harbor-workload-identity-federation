# Repository Settings
#
# YAML tree maps to GitHub API paths (base: /repos/{owner}/{repo}):
#   repository                   -> PATCH /repos/{owner}/{repo}
#   labels.{name}                -> PUT /repos/{owner}/{repo}/labels/{name}
#   branches.{name}.protection   -> PUT /repos/{owner}/{repo}/branches/{name}/protection
#   security                     -> PATCH /repos/{owner}/{repo} (security_and_analysis)
#   code_scanning                -> PATCH /repos/{owner}/{repo}/code-scanning/default-setup
#   actions                      -> PUT /repos/{owner}/{repo}/actions/permissions/workflow
#   rulesets.{name}              -> POST/PUT /repos/{owner}/{repo}/rulesets
#   environments.{name}          -> PUT /repos/{owner}/{repo}/environments/{name}
#
# Reference: https://docs.github.com/en/rest/repos

repository:
  description: Kubelet credential provider and examples for pulling and pushing images from Harbor with Federated Robot Accounts, without stored secrets.
  homepage: "https://container-registry.com/docs/"
  topics:
    - harbor
    - kubernetes
    - kubelet
    - credential-provider
    - workload-identity
    - oidc
    - container-registry
    - secretless
  visibility: public
  has_issues: true
  has_projects: true
  has_wiki: false
  has_downloads: true
  has_discussions: false
  is_template: false
  default_branch: main
  allow_forking: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true
  allow_auto_merge: false
  allow_update_branch: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
  merge_commit_title: MERGE_MESSAGE
  merge_commit_message: PR_TITLE
  web_commit_signoff_required: false

# Required for release-please to open and maintain its release pull request.
actions:
  default_workflow_permissions: read
  can_approve_pull_request_reviews: true

labels:
  blocked:
    color: e11d21
    description: Blocked by another issue or PR
  breaking-change:
    color: b60205
    description: Breaking change requiring major version bump
  bug:
    color: d73a4a
    description: Something isn't working
  component/ci:
    color: c5def5
    description: CI/CD related
  component/config:
    color: c5def5
    description: Configuration files
  component/chart:
    color: c5def5
    description: Helm chart
  component/docs:
    color: c5def5
    description: Documentation related
  component/examples:
    color: c5def5
    description: Examples and distribution scripts
  component/installer:
    color: c5def5
    description: On-node installer
  component/provider:
    color: c5def5
    description: Kubelet credential provider binary
  dependencies:
    color: 0366d6
    description: Dependencies update
  do-not-merge:
    color: e11d21
    description: PR should not be merged
  documentation:
    color: 0075ca
    description: Improvements or additions to documentation
  enhancement:
    color: a2eeef
    description: New feature or request
  good first issue:
    color: 7057ff
    description: Good for newcomers
  help wanted:
    color: "008672"
    description: Extra attention is needed
  mentor-available:
    color: 0e8a16
    description: A mentor is available to help with this issue
  needs-info:
    color: ffffff
    description: Additional information needed
  needs-rebase:
    color: e11d21
    description: PR needs to be rebased
  needs-triage:
    color: ededed
    description: Needs initial triage by maintainers
  proposal:
    color: fbca04
    description: Architectural proposal requiring discussion
  question:
    color: d876e3
    description: Further information is requested
  security:
    color: d93f0b
    description: Security-related issue or fix
  size/L:
    color: A14C05
    description: Large PR (500-1000 lines)
  size/M:
    color: 7F7203
    description: Medium PR (100-500 lines)
  size/S:
    color: 5D9801
    description: Small PR (10-100 lines)
  size/XL:
    color: C32607
    description: Extra large PR (> 1000 lines)
  size/XS:
    color: 3CBF00
    description: Extra small PR (< 10 lines)
  wip:
    color: fef2c0
    description: Work in progress

  # Conventional commit type labels
  chore:
    color: fef2c0
    description: Maintenance task
  perf:
    color: f9d0c4
    description: Performance improvement
  refactor:
    color: d4c5f9
    description: Code refactoring
  tests:
    color: bfdadc
    description: Test-related changes
  build:
    color: c2e0c6
    description: Build system changes

security:
  # Public repository: leaked registry credentials should be caught, and push
  # protection should stop them landing in the first place.
  secret_scanning:
    status: enabled
  secret_scanning_push_protection:
    status: enabled
  dependabot_security_updates:
    status: enabled

code_scanning:
  state: not-configured
  query_suite: default  # default, extended
  languages: [actions, go]

