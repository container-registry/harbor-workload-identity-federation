name: Release Assets

on:
  workflow_call:
    inputs:
      tag_name:
        description: Existing GitHub Release tag to upload binaries to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing GitHub Release tag to upload binaries to
        required: true
        type: string

permissions: {}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release assets
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -eu
          case "$TAG_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "ERROR: refusing to build for tag '$TAG_NAME'; expected vX.Y.Z"; exit 1 ;;
          esac
          task release-assets "VERSION=$TAG_NAME"

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: dist/*
