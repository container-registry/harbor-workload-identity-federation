name: Release Image

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build from
        required: true
        type: string
      version:
        description: Image tag. Defaults to `git describe` on the checked out ref.
        required: false
        default: ''
        type: string
      latest:
        description: Also move the :latest tag to this build
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build from
        required: true
        type: string
      version:
        description: Image tag. Defaults to `git describe` on the checked out ref.
        required: false
        default: ''
        type: string
      latest:
        description: Also move the :latest tag to this build
        required: false
        default: false
        type: boolean

permissions: {}

env:
  REGISTRY_ADDRESS: ${{ vars.REGISTRY_ADDRESS || '8gears.container-registry.com' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || '8gcr' }}
  REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY_ADDRESS }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push the multi-arch image
        env:
          VERSION_INPUT: ${{ inputs.version }}
          PUSH_LATEST: ${{ inputs.latest }}
        run: |
          set -eu
          # The input reaches the shell through the environment, never through
          # expression interpolation, and only a release tag or an empty value
          # is accepted. workflow_dispatch lets anyone with write access pick
          # this string, and the registry credentials are already loaded.
          case "${VERSION_INPUT}" in
            "") ;;
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "ERROR: refusing to publish version '${VERSION_INPUT}'; expected vX.Y.Z"; exit 1 ;;
          esac
          if [ "$PUSH_LATEST" = "true" ]; then
            task docker-push ${VERSION_INPUT:+VERSION=$VERSION_INPUT}
          else
            task docker-push-version ${VERSION_INPUT:+VERSION=$VERSION_INPUT}
          fi
