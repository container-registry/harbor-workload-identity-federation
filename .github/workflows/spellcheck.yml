name: Spell Check

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '**.txt'
      - '**.yml'
      - '**.yaml'
      - '.typos.toml'
  pull_request:
    paths:
      - '**.md'
      - '**.txt'
      - '**.yml'
      - '**.yaml'
      - '.typos.toml'

permissions:
  contents: read

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check spelling
        uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53 # v1.50.2
        with:
          config: .typos.toml
